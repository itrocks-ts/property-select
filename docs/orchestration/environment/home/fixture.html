<!DOCTYPE html>
<html lang="en">
<head>
	<title>Generic pane recipe</title>
	<script src="./fixture.js" type="module"></script>
</head>
<body>
<!--BEGIN-->
<article class="pane-recipe">
	<h2>Generic pane recipe</h2>
	<p>Isolated synthetic content host</p>
	<button id="register" type="button">Register content</button>
	<button id="main-action" type="button">Main action</button>
	<output id="main-result">0</output>
	<button id="suspend" type="button">Suspend</button>
	<button id="restore" type="button">Restore</button>
	<button id="remove" type="button">Remove</button>
	<button id="compete" type="button">Competing owner</button>
	<output id="pane-state">empty</output>
	<div style="height:1400px;width:1600px">Wide and tall generic main content</div>
</article>
<!--END-->
</body>
</html>
